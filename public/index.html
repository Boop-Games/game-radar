<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Radar</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img class="logo" src="/icon.png" alt="">Game Radar</div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview">Overview</button>
      <label class="platform-nav">Platforms
        <select id="platform-select" aria-label="Choose platform">
          <option value="roblox">Roblox</option>
          <option value="poki">Poki</option>
          <option value="crazygames">CrazyGames</option>
        </select>
      </label>
      <button data-tab="mobile">Mobile</button>
      <button data-tab="social">Social</button>
      <button data-tab="keywords">Keywords</button>
      <button data-tab="pages">Pages</button>
      <button data-tab="newsletter">Newsletter</button>
    </nav>
    <div class="refresh">
      <span id="status" class="muted"></span>
      <button id="refresh" class="btn">Refresh now</button>
    </div>
  </header>
  <main id="app"><div class="loading">Loading the latest data&hellip;</div></main>
  <aside id="drawer" class="drawer" hidden></aside>
  <div id="scrim" class="scrim" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
